<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Vote</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main data-contest="chance">
    <div class="top">
      <p class="eyebrow">Vote</p>
      <div id="theme" class="theme" role="group" aria-label="Colour theme"></div>
    </div>
    <h1 id="title" lang="de"></h1>
    <div id="choices" class="choices"></div>

    <form id="phone-step" class="step" hidden novalidate>
      <p id="phone-lead" class="lead"></p>
      <p id="demo-phone" class="demo" hidden></p>
      <label for="phone">Mobile number (Germany or UK)</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="32" placeholder="0151 23456789">
      <div class="actions">
        <button type="submit" class="primary">Send code</button>
        <button type="button" id="phone-back" class="quiet">Choose again</button>
      </div>
    </form>

    <form id="code-step" class="step" hidden novalidate>
      <p id="code-lead" class="lead"></p>
      <p id="demo-code" class="demo" hidden></p>
      <label for="code">Code from the SMS</label>
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="123456">
      <div class="actions">
        <button type="submit" class="primary">Confirm vote</button>
        <button type="button" id="code-back" class="quiet">Use another number</button>
      </div>
    </form>

    <p id="notice" role="status" aria-live="polite"></p>
    <h2 class="section">Results</h2>
    <ol id="tally" class="tally"></ol>
    <p class="foot"><a href="/features">How this vote works →</a></p>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
